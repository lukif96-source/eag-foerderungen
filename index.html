<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1f2a1a">
  <title>EAG-Förderungen · SOLPRO</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2393BD14'/%3E%3Cpath d='M8 21l6-6 4 4 7-8' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=10">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5M7 10l5-5 5 5M5 20h14"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 010 6.8M18.5 14.8c1.7.8 2.8 2.5 3 5.2"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3M10 16l-4-4 4-4M6 12h10"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 00-14.7-4.3L4 8M4 4v4h4M4 13a8 8 0 0014.7 4.3L20 16M20 20v-4h-4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24"><path d="M4 12a8 8 0 108-8 8.5 8.5 0 00-6 2.5L4 8.5M4 4v4.5h4.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5v.01"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c.8-4 4-6 8-6s7.2 2 8 6"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6L6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2.5L4.5 13.5H11L10 21.5l8.5-11H12z"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="9" cy="9" r=".9" fill="currentColor"/><circle cx="15" cy="15" r=".9" fill="currentColor"/><circle cx="15" cy="9" r=".9" fill="currentColor"/><circle cx="9" cy="15" r=".9" fill="currentColor"/><circle cx="12" cy="12" r=".9" fill="currentColor"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6.2 7.5V19l-3.6 1.5v-8z"/></symbol>
  </svg>

  <!-- Ladebildschirm -->
  <div id="laden" class="laden">
    <div class="laden-logo"><svg><use href="#i-sun"/></svg></div>
    <div class="laden-text">EAG-Förderungen wird geladen …</div>
  </div>

  <!-- Login -->
  <main id="login" class="login" hidden>
    <form id="login-form" class="login-karte" autocomplete="on">
      <div class="marke marke-gross"><span class="marke-zeichen"><svg><use href="#i-sun"/></svg></span><span><b>SOLPRO</b> EAG-Förderungen</span></div>
      <p class="login-hinweis" id="login-titel">Bitte melde dich an.</p>
      <label class="feld"><span>E-Mail</span><input type="email" id="login-mail" required autocomplete="username"></label>
      <label class="feld" id="login-pw-feld"><span>Passwort</span><input type="password" id="login-pw" required autocomplete="current-password" minlength="8"></label>
      <div class="login-fehler" id="login-fehler" hidden></div>
      <button type="submit" class="btn btn-primaer btn-breit" id="login-btn">Anmelden</button>
      <div class="login-links">
        <button type="button" class="link" id="login-modus">Noch kein Konto? Registrieren</button>
        <button type="button" class="link" id="login-vergessen">Passwort vergessen</button>
      </div>
    </form>
  </main>

  <!-- Kein Zugriff -->
  <main id="gesperrt" class="login" hidden>
    <div class="login-karte">
      <div class="marke marke-gross"><span class="marke-zeichen"><svg><use href="#i-sun"/></svg></span><span><b>SOLPRO</b> EAG-Förderungen</span></div>
      <p><b>Noch nicht freigeschaltet.</b></p>
      <p class="login-hinweis">Du bist als <b id="gesperrt-mail"></b> angemeldet, aber noch nicht für die Förderliste freigegeben. Bitte beim Admin melden.</p>
      <button type="button" class="btn btn-breit" data-aktion="abmelden"><svg><use href="#i-logout"/></svg>Abmelden</button>
    </div>
  </main>

  <!-- App -->
  <div id="app" hidden>
    <header class="kopf">
      <div class="marke"><span class="marke-zeichen"><svg><use href="#i-sun"/></svg></span><span><b>SOLPRO</b> <span class="marke-sub">EAG-Förderungen</span></span></div>
      <div class="kopf-aktionen">
        <button class="btn btn-kopf btn-kopf-haupt" data-aktion="neu" data-recht="bearbeiten"><svg><use href="#i-plus"/></svg><span>Neuer Kunde</span></button>
        <button class="btn btn-kopf" data-aktion="import" data-recht="admin" title="Excel-Liste importieren"><svg><use href="#i-upload"/></svg><span>Excel-Import</span></button>
        <div class="kopf-nutzer">
          <button class="btn btn-kopf btn-rund" id="nutzer-btn" title="Menü"><svg><use href="#i-menu"/></svg></button>
          <div class="menue" id="nutzer-menue" hidden>
            <div class="menue-info"><b id="nutzer-name"></b><span id="nutzer-mail" class="grau"></span><span class="rolle" id="nutzer-rolle"></span></div>
            <button class="menue-punkt" data-aktion="export"><svg><use href="#i-download"/></svg>Als Excel herunterladen</button>
            <button class="menue-punkt" data-aktion="nutzer" data-recht="admin"><svg><use href="#i-users"/></svg>Nutzer &amp; Rollen</button>
            <button class="menue-punkt" data-aktion="neu-laden"><svg><use href="#i-refresh"/></svg>Aktualisieren</button>
            <button class="menue-punkt" data-aktion="passwort"><svg><use href="#i-user"/></svg>Passwort ändern</button>
            <button class="menue-punkt" data-aktion="abmelden"><svg><use href="#i-logout"/></svg>Abmelden</button>
          </div>
        </div>
      </div>
    </header>

    <main class="inhalt">
      <button class="freischalt-hinweis" id="freischalt-hinweis" data-aktion="nutzer" hidden></button>
      <section class="werkzeug">
        <label class="suche"><svg><use href="#i-search"/></svg><input type="search" id="f-suche" placeholder="Kunde suchen (Name, Ort, Zählpunkt, Projekt …)"></label>
        <select id="f-jahr" class="jahr-wahl" title="Jahr"></select>
        <button class="btn btn-filter" data-aktion="mehr-filter" id="mehr-filter-btn"><svg><use href="#i-filter"/></svg><span>Filter</span></button>
      </section>
      <section class="filter" id="mehr-filter" hidden>
        <select id="f-call" title="Fördercall"></select>
        <select id="f-art" title="Art"></select>
        <select id="f-mitarbeiter" title="Mitarbeiter (Verkauf)"></select>
        <select id="f-zieher" title="Ticket-Zieher"></select>
        <label class="schalter" title="Gelöschte Einträge anzeigen" data-recht="bearbeiten"><input type="checkbox" id="f-papierkorb"><span>Papierkorb</span></label>
        <button class="btn btn-leise" data-aktion="filter-zurueck" id="filter-zurueck" hidden><svg><use href="#i-close"/></svg>Zurücksetzen</button>
      </section>

      <nav class="reiter" id="reiter" aria-label="Ansicht"></nav>
      <div class="extra-filter" id="extra-filter"></div>
      <div id="liste-info" class="liste-info"></div>
      <section id="liste" class="liste"></section>
    </main>
  </div>

  <!-- Detail -->
  <div class="overlay" id="detail" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="d-titel">
      <header class="panel-kopf">
        <div>
          <h2 id="d-titel">Förderung</h2>
          <div class="panel-sub" id="d-sub"></div>
        </div>
        <button class="btn btn-leise btn-rund" data-aktion="detail-zu" title="Schließen"><svg><use href="#i-close"/></svg></button>
      </header>
      <div class="panel-inhalt" id="d-inhalt"></div>
      <footer class="panel-fuss">
        <button class="btn btn-gefahr-leise" id="d-loeschen" data-recht="bearbeiten"><svg><use href="#i-trash"/></svg><span>In Papierkorb</span></button>
        <span class="panel-status" id="d-status"></span>
        <button class="btn" data-aktion="detail-zu">Schließen</button>
        <button class="btn btn-primaer" id="d-speichern" data-recht="bearbeiten"><svg><use href="#i-check"/></svg>Speichern</button>
      </footer>
    </div>
  </div>

  <!-- Allgemeiner Dialog (Import, Nutzer, Passwort) -->
  <div class="overlay" id="dialog" hidden>
    <div class="panel panel-mittel" role="dialog" aria-modal="true" aria-labelledby="dlg-titel">
      <header class="panel-kopf">
        <h2 id="dlg-titel"></h2>
        <button class="btn btn-leise btn-rund" data-aktion="dialog-zu" title="Schließen"><svg><use href="#i-close"/></svg></button>
      </header>
      <div class="panel-inhalt" id="dlg-inhalt"></div>
      <footer class="panel-fuss" id="dlg-fuss"></footer>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
  <script src="js/config.js?v=1"></script>
  <script src="js/ablauf.js?v=2"></script>
  <script src="js/daten.js?v=7"></script>
  <script src="js/import.js?v=2"></script>
  <script src="js/app.js?v=10"></script>
</body>
</html>
